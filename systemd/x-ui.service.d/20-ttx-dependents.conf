# Local dependency recovery for upstream x-ui updates.
#
# ttx-bridge and trusttunnel Require=x-ui, so an explicit stop/restart of x-ui
# also stops both dependents. Upstream web updates start x-ui again but do not
# know about local services. Pull them into every x-ui start transaction while
# keeping the dependency soft: a TrustTunnel failure must not block the panel.

[Unit]
Wants=ttx-bridge.service trusttunnel.service
Before=ttx-bridge.service trusttunnel.service
