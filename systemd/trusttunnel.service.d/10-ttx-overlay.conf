# Drop-in к штатному юниту trusttunnel.service. Сам юнит не редактируется —
# это отдельный override-файл, который systemd накладывает поверх него.
#
# Задаёт только порядок запуска: сначала панель x-ui и ttx-bridge, потом
# TrustTunnel. Reconcile намеренно НЕ запускается через ExecStartPre: изменение
# vpn.toml внутри транзакции старта нельзя безопасно откатить при неуспешном
# запуске endpoint. Установщик/bootstrap выполняют reconcile до enable, а
# дальнейшие изменения применяет ttx-bridge с restart + health check + rollback.

[Unit]
After=network-online.target x-ui.service ttx-bridge.service
Wants=network-online.target
Requires=x-ui.service
