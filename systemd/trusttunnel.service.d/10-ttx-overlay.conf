# Drop-in к штатному юниту trusttunnel.service. Сам юнит не редактируется —
# это отдельный override-файл, который systemd накладывает поверх него.
#
# Делает две вещи:
#   1. гарантирует порядок запуска: сначала панель x-ui, потом ttx-bridge,
#      потом сам TrustTunnel;
#   2. на каждый (пере)старт прогоняет разовый reconcile, чтобы vpn.toml
#      был согласован ещё до того, как endpoint успеет его прочитать.

[Unit]
After=network-online.target x-ui.service ttx-bridge.service
Wants=network-online.target
Requires=x-ui.service

[Service]
# В ExecStartPre нельзя рестартовать тот же юнит: systemd получил бы рекурсивную
# транзакцию. Конфиг записывается, а текущий старт и так подхватит его.
ExecStartPre=/usr/local/bin/ttx reconcile --no-restart
