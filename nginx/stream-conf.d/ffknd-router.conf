# Route only the two exact portal names to the local TLS terminator. Every
# other ClientHello (and traffic without SNI) remains byte-for-byte TLS
# passthrough to Xray Reality.
map $ssl_preread_server_name $ffknd_tls_backend {
    ffknd.ru     127.0.0.1:9443;
    www.ffknd.ru 127.0.0.1:9443;
    default      127.0.0.1:10443;
}

server {
    listen 443 so_keepalive=on;

    ssl_preread on;
    preread_buffer_size 64k;
    preread_timeout 10s;

    proxy_pass $ffknd_tls_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 7d;
    proxy_socket_keepalive on;
    proxy_next_upstream off;

    # Do not enable proxy_protocol here: Xray must receive the original TLS
    # ClientHello as the first bytes of the connection.
    error_log /var/log/nginx/ffknd-stream-error.log warn;
}
