server {
    # Public :443 belongs to the stream router. TLS termination for the portal
    # is deliberately loopback-only.
    listen 127.0.0.1:9443 ssl http2;
    server_name ffknd.ru www.ffknd.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ffknd.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffknd.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ffknd_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 128k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Canonicalize www before the strict Host allow-list below. Using a fixed
    # redirect target prevents an untrusted Host value from entering Location.
    if ($host = www.ffknd.ru) {
        return 308 https://ffknd.ru$request_uri;
    }

    # SNI selected this virtual endpoint, but an unrelated HTTP Host must not
    # be accepted through it.
    if ($host != ffknd.ru) {
        return 421;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_set_header Host ffknd.ru;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host ffknd.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Replace, rather than duplicate, the portal's equivalent headers.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }
}
