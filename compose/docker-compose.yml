# Docker-вариант. Образы собираются из upstream-репозиториев ПО ССЫЛКЕ,
# исходники не форкаются и не патчатся: compose тянет их сам по тегу.
services:

  # Нейтральный HTTPS-origin для обычных браузерных запросов. Portal разделяет
  # network namespace с TrustTunnel и слушает только их общий loopback:8080.
  # Публичных портов у него нет, а владельцем 443/tcp+udp остаётся TrustTunnel.
  portal:
    build: ../portal
    container_name: ffknd-portal
    restart: unless-stopped
    user: portal
    depends_on:
      - trusttunnel
    environment:
      PORTAL_HOST: 127.0.0.1
      PORTAL_PORT: 8080
      PORTAL_DB: /data/portal.db
      PORTAL_PASSWORD_HASH: ${PORTAL_PASSWORD_HASH:-}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-https://ffknd.ru}
      PORTAL_COOKIE_SECURE: "true"
      PORTAL_TRUST_PROXY: "false"
      PORTAL_ALLOW_PRIVATE_URLS: ${PORTAL_ALLOW_PRIVATE_URLS:-false}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - portal-data:/data
    network_mode: "service:trusttunnel"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  x-ui:
    image: ghcr.io/mhsanaei/3x-ui:${XUI_TAG:-latest}
    container_name: ttx-xui
    restart: unless-stopped
    environment:
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_INIT_WEB_BASE_PATH: ${XUI_BASE_PATH:-/}
    volumes:
      - xui-db:/etc/x-ui
      - xui-cert:/root/cert
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      ttx: { aliases: [xui] }
    ports:
      - "127.0.0.1:${XUI_PANEL_PORT:-2053}:${XUI_PANEL_PORT:-2053}"

  trusttunnel:
    build:
      # Сборка прямо из upstream-репозитория по тегу — без вендоринга кода.
      context: https://github.com/TrustTunnel/TrustTunnel.git#v${TT_VERSION:-1.0.33}
      dockerfile: Dockerfile.prebuilt
      args:
        TT_VERSION: ${TT_VERSION:-1.0.33}
    container_name: ttx-endpoint
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    volumes:
      - tt-conf:/trusttunnel_endpoint
      - ./credentials.toml:/trusttunnel_endpoint/credentials.toml:ro
      - ./hosts.toml:/trusttunnel_endpoint/hosts.toml:ro
      - ./rules.toml:/trusttunnel_endpoint/rules.toml:ro
      - ./certs:/opt/trusttunnel/certs:ro
    networks: [ttx]
    ports:
      - "443:8443"       # TCP: HTTP/1.1 и HTTP/2
      - "443:8443/udp"   # UDP: QUIC / HTTP-3
    cap_add: [NET_RAW]   # нужно только если включён [icmp]

  bridge:
    build: ../bridge
    container_name: ttx-bridge
    restart: unless-stopped
    depends_on: [x-ui]
    environment:
      TTX_CONFIG: /etc/ttx/bridge.json
    volumes:
      - ./bridge.json:/etc/ttx/bridge.json:ro
      - ./vpn.base.toml:/etc/ttx/vpn.base.toml:ro
      - ../templates/compat.json:/etc/ttx/compat.json:ro
      - tt-conf:/trusttunnel_endpoint     # сюда мост пишет итоговый vpn.toml
    networks: [ttx]
    healthcheck:
      test: ["CMD", "test", "-f", "/trusttunnel_endpoint/vpn.toml"]
      interval: 5s
      timeout: 2s
      retries: 24

volumes:
  xui-db:
  xui-cert:
  tt-conf:
  portal-data:

networks:
  ttx:
    driver: bridge
